AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Simple Object Detector Serverless Pipeline Architecture (x86_64 Production)

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Architectures:
      - x86_64 # Enforces x86_64 as the global baseline architecture for all functions
    LoggingConfig:
      LogFormat: JSON

# parameters used in deploy.sh
Parameters:
  LowerAppName:
    Type: String
    Description: "Lowercased application name enforced by deploy.sh"
    AllowedPattern: "^[a-z0-9-]+$"
  EnvironmentName:
    Type: String
    Description: "Targeted deployment stage environment (dev/prod)"
    AllowedPattern: "^[a-z0-9-]+$"
  LogRetentionInDays:
    Type: Number
    Description: "Days to keep Lambda logs"
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365]

Resources:
  # 1. Private S3 Bucket holding the frontend (served to visitors only through CloudFront)
  HtmlStorageBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${LowerAppName}-${EnvironmentName}-frontend-bucket"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # Only this stack's CloudFront distribution may read the frontend files
  HtmlBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref HtmlStorageBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: 's3:GetObject'
            Resource: !Sub 'arn:aws:s3:::${HtmlStorageBucket}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${WebsiteDistribution}"

  # 1.2. CloudFront: HTTPS website address in front of the private frontend bucket
  WebsiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${LowerAppName}-${EnvironmentName}-frontend-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  WebsiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub "Simple Object Detector frontend (${EnvironmentName})"
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100 # North America and Europe edge locations (cheapest)
        Origins:
          - Id: FrontendBucket
            DomainName: !GetAtt HtmlStorageBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt WebsiteOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: "" # must be empty when using Origin Access Control
        DefaultCacheBehavior:
          TargetOriginId: FrontendBucket
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          Compress: true
          # AWS managed "CachingOptimized" policy; deploy.sh invalidates the cache after uploads
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6

  # 1.5. Private S3 Bucket for user uploads and annotated results.
  # Results are shared with the browser through short-lived presigned URLs only.
  UploadsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${LowerAppName}-${EnvironmentName}-uploads-bucket"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireUserImages
            Status: Enabled
            Prefix: data/
            ExpirationInDays: 7

  # 2. DynamoDB Database Table
  SODJobStatusTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "SOD_JobStatusTable-${EnvironmentName}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: imageId
          AttributeType: S
      KeySchema:
        - AttributeName: imageId
          KeyType: HASH

  # 3. HTTP API Gateway with CORS and throttling to cap processing costs
  SODGatewayApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: !Sub "SOD_GatewayApi-${EnvironmentName}"
      # Strict default protects the expensive POST (each upload runs the 3 GB processor)
      DefaultRouteSettings:
        ThrottlingBurstLimit: 10
        ThrottlingRateLimit: 5
      # Status checks are cheap DynamoDB reads; the page polls every 2 s per open job
      RouteSettings:
        "GET /{imageId}":
          ThrottlingBurstLimit: 100
          ThrottlingRateLimit: 50
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - '*'

  # 4. SQS Queue
  SODQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "SOD_Queue-${EnvironmentName}"
      # AWS recommends at least 6x the consumer function's timeout (60s)
      VisibilityTimeout: 360
      # Messages that crash or time out the processor 3 times are parked instead of retried forever
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt SODDeadLetterQueue.Arn
        maxReceiveCount: 3

  # 4.5. Dead-letter queue for messages the processor could not handle
  SODDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "SOD_DeadLetterQueue-${EnvironmentName}"
      MessageRetentionPeriod: 1209600 # 14 days, the maximum

  # 4.8. Log groups owned by the stack: logs expire after LogRetentionInDays and are
  # deleted with the stack. (Lambda's auto-created /aws/lambda/<function> groups never
  # expire and outlive the stack, so each function is pointed at its group below.)
  GetImageUrlLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}/getImageUrl"
      RetentionInDays: !Ref LogRetentionInDays

  CheckJobStatusLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}/checkJobStatus"
      RetentionInDays: !Ref LogRetentionInDays

  ProcessImageLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}/processImage"
      RetentionInDays: !Ref LogRetentionInDays

  # 5. Python Lambda Function (SOD_getImageUrl)
  GetImageUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "SOD_getImageUrl-${EnvironmentName}"
      Runtime: python3.14
      CodeUri: ./backend-lambda/
      Handler: get_image_url.lambda_handler
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref GetImageUrlLogGroup
      Environment:
        Variables:
          TARGET_BUCKET: !Ref UploadsBucket
          QUEUE_URL: !Ref SODQueue
          DATABASE_NAME: !Ref SODJobStatusTable
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt SODQueue.QueueName
        - DynamoDBCrudPolicy:
            TableName: !Ref SODJobStatusTable
        - Statement:
            - Sid: AllowIngestionToWriteToS3
              Effect: Allow
              Action:
                - "s3:PutObject"
              Resource:
                - !Sub "${UploadsBucket.Arn}/*"
      Events:
        PostRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref SODGatewayApi
            Path: /
            Method: post

  # 5.5. Python Lambda Function (SOD_checkJobStatus)
  SODCheckJobStatus:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "SOD_checkJobStatus-${EnvironmentName}"
      Runtime: python3.14
      CodeUri: ./backend-lambda/
      Handler: check_image_status.lambda_handler
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref CheckJobStatusLogGroup
      Environment:
        Variables:
          DATABASE_NAME: !Ref SODJobStatusTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SODJobStatusTable
      Events:
        GetRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref SODGatewayApi
            Path: /{imageId}
            Method: get

  # 6. Container Lambda Function (SOD_processImage)
  ProcessImageFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "SOD_processImage-${EnvironmentName}"
      PackageType: Image
      # One image per invocation: URL download (max 10s) + inference + S3 upload
      Timeout: 60
      # Lambda CPU scales with memory; measure before lowering
      MemorySize: 3008
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref ProcessImageLogGroup
      Environment:
        Variables:
          DATABASE_NAME: !Ref SODJobStatusTable
          TARGET_BUCKET: !Ref UploadsBucket
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SODJobStatusTable
        - Statement:
            - Sid: AllowLambdaToReadWriteS3
              Effect: Allow
              Action:
                - "s3:GetObject"
                - "s3:PutObject"
              Resource:
                - !Sub "${UploadsBucket.Arn}/*"
      Events:
        QueueTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt SODQueue.Arn
            # One message per invocation, so uploads are processed in parallel
            # and one slow image never delays others in the same batch
            BatchSize: 1
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: ./backend-container
      DockerTag: latest
      DockerBuildArgs:
        BUILDX_NO_DEFAULT_ATTESTATIONS: "1"

Outputs:
  HttpApiUrl:
    Description: "Base URL of the detector HTTP API Gateway"
    Value: !Sub "https://${SODGatewayApi}.execute-api.${AWS::Region}.amazonaws.com"
  S3BucketName:
    Description: "Name of the HTML S3 Bucket"
    Value: !Ref HtmlStorageBucket
  UploadsBucketName:
    Description: "Name of the private uploads/results S3 Bucket"
    Value: !Ref UploadsBucket
  WebsiteURL:
    Description: "HTTPS URL for the hosted frontend website (CloudFront)"
    Value: !Sub "https://${WebsiteDistribution.DomainName}"
  DistributionId:
    Description: "CloudFront distribution ID (deploy.sh invalidates its cache after uploads)"
    Value: !Ref WebsiteDistribution
