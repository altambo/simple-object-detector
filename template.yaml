AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Simple Object Detector Serverless Pipeline Architecture (x86_64 Production)

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Architectures:
      - x86_64 # Enforces x86_64 as the global baseline architecture for all functions
    LoggingConfig:
      LogFormat: JSON

# parameters used in deploy.sh
Parameters:
  LowerAppName:
    Type: String
    Description: "Lowercased application name enforced by deploy.sh"
  EnvironmentName:
    Type: String
    Description: "Targeted deployment stage environment (dev/prod)"

Resources:
  # 1. S3 Bucket configured for Static Website Hosting
  HtmlStorageBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${LowerAppName}-${EnvironmentName}-frontend-bucket"
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  # S3 Bucket Policy to allow public GET requests for website visitors
  HtmlBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref HtmlStorageBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PublicReadForGetBucketObjects
            Effect: Allow
            Principal: '*'
            Action: 's3:GetObject'
            Resource: !Sub 'arn:aws:s3:::${HtmlStorageBucket}/*'

  # 2. DynamoDB Database Table
  SODJobStatusTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: SOD_JobStatusTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: imageId
          AttributeType: S
      KeySchema:
        - AttributeName: imageId
          KeyType: HASH

  # 3. HTTP API Gateway with CORS updated to allow ALL headers
  SODGatewayApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: SOD_GatewayApi
      CorsConfiguration:
        AllowOrigins:
          - '*' 
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - '*' 

  # 4. SQS Queue
  SODQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: SOD_Queue
      VisibilityTimeout: 240

  # 5. Python Lambda Function (SOD_getImageUrl)
  GetImageUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: SOD_getImageUrl
      Runtime: python3.14
      CodeUri: ./backend-lambda/        
      Handler: get_image_url.lambda_handler 
      Environment:
        Variables:
          TARGET_BUCKET: !Sub "${LowerAppName}-${EnvironmentName}-frontend-bucket"
          QUEUE_URL: !Ref SODQueue
          DATABASE_NAME: !Ref SODJobStatusTable
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt SODQueue.QueueName
        - DynamoDBCrudPolicy:
            TableName: !Ref SODJobStatusTable
        - Statement:
            - Sid: AllowIngestionToWriteToS3
              Effect: Allow
              Action:
                - "s3:PutObject"
                - "s3:PutObjectAcl"
              Resource: 
                - !Sub "arn:aws:s3:::${LowerAppName}-${EnvironmentName}-frontend-bucket/*"
                - !Sub "arn:aws:s3:::${LowerAppName}-${EnvironmentName}-frontend-bucket"
      Events:
        PostRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref SODGatewayApi
            Path: /
            Method: post

  # NEW 5.5. Python Lambda Function (SOD_checkJobStatus)
  SODCheckJobStatus:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: SOD_checkJobStatus
      Runtime: python3.14
      CodeUri: ./backend-lambda/
      Handler: check_image_status.lambda_handler
      Environment:
        Variables:
          TARGET_BUCKET: !Sub "${LowerAppName}-${EnvironmentName}-frontend-bucket"
          QUEUE_URL: !Ref SODQueue
          DATABASE_NAME: !Ref SODJobStatusTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SODJobStatusTable
      Events:
        GetRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref SODGatewayApi
            Path: /{imageId}
            Method: get

  # 6. Container Lambda Function (SOD_processImage)
  ProcessImageFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: SOD_processImage
      PackageType: Image
      Timeout: 240
      MemorySize: 3008 
      Environment:
        Variables:
          DATABASE_NAME: !Ref SODJobStatusTable
          TARGET_BUCKET: !Sub "${LowerAppName}-${EnvironmentName}-frontend-bucket"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SODJobStatusTable
        - Statement:
            - Sid: AllowLambdaToWriteToS3
              Effect: Allow
              Action:
                - "s3:GetObject"
                - "s3:PutObject"
                - "s3:PutObjectAcl" # Helpful if your python script applies custom ACL parameters on upload
              Resource: 
                - !Sub "arn:aws:s3:::${LowerAppName}-${EnvironmentName}-frontend-bucket/*"
                - !Sub "arn:aws:s3:::${LowerAppName}-${EnvironmentName}-frontend-bucket"
                
      Events:
        QueueTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt SODQueue.Arn
            BatchSize: 10
    Metadata:
      Dockerfile: Dockerfile            
      DockerContext: ./backend-container 
      DockerTag: latest
      DockerBuildArgs:
        BUILDX_NO_DEFAULT_ATTESTATIONS: "1"

  # # 6. Container Lambda Function (SOD_processImage)
