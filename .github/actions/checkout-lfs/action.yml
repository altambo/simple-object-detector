name: Pull Git LFS files (cached)
description: >
  Restores Git LFS objects (the model weights) from the Actions cache and only
  downloads them when they change, to save Git LFS bandwidth. Run after actions/checkout.
runs:
  using: composite
  steps:
    - name: List LFS objects
      shell: bash
      run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-assets-id

    - name: Restore LFS cache
      uses: actions/cache@v6
      with:
        path: .git/lfs
        key: lfs-${{ hashFiles('.lfs-assets-id') }}

    - name: Pull LFS files
      shell: bash
      run: git lfs pull
