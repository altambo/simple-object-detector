<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Object Detection Pipeline</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --background: #f8fafc;
            --card: #ffffff;
            --text: #0f172a;
            --border: #e2e8f0;
        }

        /* MOBILE OPTIMIZATION: Use box-sizing universally to prevent overflow issues */
        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--background);
            color: var(--text);
            margin: 0;
            /* MOBILE OPTIMIZATION: Reduce heavy desktop padding to slim, mobile-friendly spacing */
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: var(--card);
            /* MOBILE OPTIMIZATION: Scale down padding slightly so content doesn't get squeezed */
            padding: 24px 16px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            max-width: 600px;
            width: 100%;
            border: 1px solid var(--border);
        }

        h1 {
            margin-top: 0;
            /* MOBILE OPTIMIZATION: Slightly smaller font size to prevent word-wrapping on narrow screens */
            font-size: 22px;
            text-align: center;
            color: #1e293b;
            margin-bottom: 20px;
        }

        .status-container {
            margin-bottom: 20px; /* Changed from margin-top to separate it from inputs below */
        }

        .status-label {
            display: block;
            font-weight: 600;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #64748b;
            margin-bottom: 6px;
        }

        #status {
            text-align: center;
            font-weight: 600;
            font-size: 14px;
            color: #64748b;
            padding: 12px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
        }

        .input-group {
            margin-bottom: 16px;
            padding: 16px;
            background: #f1f5f9;
            border-radius: 8px;
            border: 1px dashed #cbd5e1;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 14px;
        }

        /* MOBILE OPTIMIZATION: Style file input to render cleanly on modern mobile WebKit engines */
        input[type="file"] {
            width: 100%;
            font-size: 14px;
        }

        /* MOBILE OPTIMIZATION: Ensure inputs are exactly 16px+ text size to stop iOS from auto-zooming */
        input[type="url"] {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 16px; 
            background: #ffffff;
        }

        .divider {
            text-align: center;
            margin: 12px 0;
            font-weight: 600;
            color: #64748b;
            font-size: 13px;
        }

        /* MOBILE OPTIMIZATION: Increase vertical touch area (minimum 44px tap target height) */
        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            /* Prevents gray tap highlight behavior on mobile webkit engines */
            -webkit-tap-highlight-color: transparent;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        .result-container {
            margin-top: 20px;
            text-align: center;
        }

        #resultImage {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
            display: none;
            border: 1px solid var(--border);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Simple Object Detector</h1>
    
    <div class="status-container">
        <span class="status-label">Pipeline Status:</span>
        <div id="status">RATS! No image provided!</div>
    </div>
    
    <!-- ✅ WRAP EVERYTHING IN A FORM AND ENFORCE RETURN FALSE -->
    <form onsubmit="processImage(event); return false;">
        <!-- Option 1: Local Device Hard Drive Upload -->
        <div class="input-group">
            <label for="fileInput">Upload image from your device:</label>
            <input type="file" id="fileInput" accept="image/jpeg,image/jpg" onchange="clearUrlInput()" />
        </div>

        <div class="divider">OR</div>

        <!-- Option 2: Image Web URL -->
        <div class="input-group">
            <label for="urlInput">Submit an image web URL:</label>
            <input type="url" id="urlInput" placeholder="https://ultralytics.com/images/bus.jpg" oninput="clearFileInput()" />
        </div>

        <!-- ✅ CHANGE TO A SUBMIT TYPE BUTTON -->
        <button id="submitBtn" type="submit">Process Image</button>
    </form>
    
    <div class="result-container">
        <img id="resultImage" src="https://ultralytics.com/images/bus.jpg" alt="Processing Results" />
    </div>
</div>

<!-- Load scripts sequentially -->
<script src="config.js"></script>
<script src="main.js"></script>

</body>
</html>
